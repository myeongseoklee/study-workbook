<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달성은 시점이고, 감시는 그 뒤에 남거나 사라진다</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f9f9f7;
      --color-ink:     #0b0b0b;
      --color-muted:   #52514e;
      --color-accent:  #eb6834;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Gantt · Consistency kinds</p>
    <h1>달성은 상태가 아니라 시점이다 — 감시를 푼 뒤에 깨지면 아무도 모른다</h1>

    <svg viewBox="0 0 1000 460" role="img" aria-labelledby="consistency-achieve-vs-watch-title consistency-achieve-vs-watch-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="consistency-achieve-vs-watch-title">일관성 종류별 참인 구간과 감시 구간</title>
      <desc id="consistency-achieve-vs-watch-desc">하나의 변경을 공통 시간축에 놓고 세 체제를 비교하는 간트 차트. 트랜잭션 일관성은 전 구간이 참이다. 언젠가 일관성은 달성 시점에서 참이 되고 시스템은 거기서 감시를 풀기 때문에, 그 뒤에 다시 어긋나도 감시 구간이 없어 드러나지 않는다. 감사 시스템은 달성 뒤에도 감시를 계속해 다시 어긋난 것을 잡아 맞춘다.</desc>

      <defs>
        <pattern id="cavw-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(11,11,11,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f9f9f7"/>
      <rect width="100%" height="100%" fill="url(#cavw-dots)" opacity="0.55"/>

      <!-- ── 시간축. 라벨 열 x 20~200, 타임라인 x 200~920 ────────────────── -->
      <text x="20" y="48" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TIME →</text>
      <text x="200" y="48" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace">변경 발생</text>
      <text x="440" y="48" fill="#eb6834" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">달성</text>
      <text x="680" y="48" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">다시 어긋난다</text>
      <text x="840" y="48" fill="#52514e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">감사가 잡는다</text>
      <line x1="20" y1="60" x2="960" y2="60" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>

      <!-- ── 구역 ─────────────────────────────────────────────────────── -->
      <rect x="20" y="68" width="940" height="72" rx="6" fill="rgba(11,11,11,0.02)" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>
      <text x="32" y="84" fill="#898781" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">애그리게이트 내부 — 트랜잭션 일관성</text>

      <rect x="20" y="148" width="940" height="112" rx="6" fill="rgba(11,11,11,0.02)" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>
      <text x="32" y="164" fill="#898781" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">애그리게이트 간 — 언젠가 달성 · 오케스트레이션 프레임워크</text>

      <rect x="20" y="268" width="940" height="112" rx="6" fill="rgba(11,11,11,0.02)" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>
      <text x="32" y="284" fill="#898781" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">감사 시스템 — 예: 회계 감사</text>

      <!-- ── 초점: 어긋났는데 감시가 없는 구간 ──────────────────────────── -->
      <rect x="680" y="172" width="240" height="88" rx="4" fill="rgba(235,104,52,0.05)" stroke="rgba(235,104,52,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="692" y="188" fill="#eb6834" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">감시 없음</text>

      <!-- ── 눈금선 ───────────────────────────────────────────────────── -->
      <line x1="200" y1="60" x2="200" y2="380" stroke="#c3c2b7" stroke-width="1"/>
      <line x1="440" y1="60" x2="440" y2="380" stroke="#eb6834" stroke-width="0.8" stroke-dasharray="4,3"/>
      <line x1="680" y1="60" x2="680" y2="380" stroke="#898781" stroke-width="0.8" stroke-dasharray="4,3"/>
      <line x1="840" y1="60" x2="840" y2="380" stroke="#898781" stroke-width="0.8" stroke-dasharray="4,3"/>

      <!-- ── 막대. 채워진 칸 = 그 조건이 참 ─────────────────────────────── -->
      <!-- 구역 1: 트랜잭션 일관성 -->
      <text x="32" y="116" fill="#0b0b0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif">일관성</text>
      <rect x="200" y="100" width="720" height="24" rx="4" fill="rgba(82,81,78,0.15)" stroke="#52514e" stroke-width="1"/>

      <!-- 구역 2: 언젠가 달성 -->
      <text x="32" y="196" fill="#0b0b0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif">일관성</text>
      <rect x="440" y="180" width="240" height="24" rx="4" fill="rgba(82,81,78,0.15)" stroke="#52514e" stroke-width="1"/>
      <text x="32" y="236" fill="#0b0b0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif">감시</text>
      <rect x="200" y="220" width="240" height="24" rx="4" fill="rgba(82,81,78,0.15)" stroke="#52514e" stroke-width="1"/>

      <!-- 구역 3: 감사 시스템 -->
      <text x="32" y="316" fill="#0b0b0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif">일관성</text>
      <rect x="440" y="300" width="240" height="24" rx="4" fill="rgba(82,81,78,0.15)" stroke="#52514e" stroke-width="1"/>
      <rect x="840" y="300" width="80" height="24" rx="4" fill="rgba(82,81,78,0.15)" stroke="#52514e" stroke-width="1"/>
      <text x="32" y="356" fill="#0b0b0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif">감시</text>
      <rect x="200" y="340" width="720" height="24" rx="4" fill="rgba(82,81,78,0.15)" stroke="#52514e" stroke-width="1"/>

      <!-- ── 범례 ─────────────────────────────────────────────────────── -->
      <line x1="20" y1="408" x2="960" y2="408" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>
      <text x="20" y="428" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="420" width="16" height="10" rx="2" fill="rgba(82,81,78,0.15)" stroke="#52514e" stroke-width="1"/>
      <text x="124" y="428" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">조건이 참인 구간 — 빈 곳은 거짓</text>
      <rect x="376" y="420" width="16" height="10" rx="2" fill="rgba(235,104,52,0.05)" stroke="rgba(235,104,52,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="400" y="428" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">어긋났는데 감시가 없는 구간</text>
      <line x1="644" y1="425" x2="664" y2="425" stroke="#eb6834" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="672" y="428" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">달성 시점</text>
    </svg>
  </div>
</body>
</html>
