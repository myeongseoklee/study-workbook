<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP 인가 체인 7단계</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f9f9f7;
      --color-ink:     #0b0b0b;
      --color-muted:   #52514e;
      --color-accent:  #eb6834;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · MCP authorization</p>
    <h1>401에서 Bearer까지 — 각 고리가 누구와 무엇을 주고받나</h1>

    <svg viewBox="0 0 960 720" role="img" aria-labelledby="auth-chain-title auth-chain-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="auth-chain-title">MCP 인가 체인 7단계의 메시지 왕복</title>
      <desc id="auth-chain-desc">MCP 서버(리소스 서버) · MCP 클라이언트 · 인가 서버 세 참여자 사이의 시간순 메시지 교환. 클라이언트가 가운데에서 왕복을 주도한다. 단계 1과 2, 그리고 7은 MCP 서버와 주고받고 단계 3·5·6은 인가 서버와 주고받는다. 단계 4인 클라이언트 등록은 이 셋 사이의 와이어 홉이 아니어서 화살표 없이 표시된다. 각 단계에 해당 RFC가 붙어 있고, 마지막 Bearer 요청만 강조색으로 그려 체인 전체가 그 한 번의 호출을 위한 준비였음을 보인다.</desc>

      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(11,11,11,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#52514e"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2a78d6"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6834"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f9f7"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ── 단계 색인 열 ─────────────────────────────────────── -->
      <text x="20" y="52" fill="#898781" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP</text>

      <!-- ── 참여자 (y 64~128) ────────────────────────────────── -->
      <rect x="112" y="64" width="176" height="64" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1"/>
      <rect x="120" y="72" width="28" height="12" rx="2" fill="none" stroke="rgba(11,11,11,0.40)" stroke-width="0.8"/>
      <text x="134" y="81" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RS</text>
      <text x="200" y="104" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP 서버</text>
      <text x="200" y="120" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PRM · aud 검증</text>

      <rect x="432" y="64" width="176" height="64" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1"/>
      <rect x="440" y="72" width="44" height="12" rx="2" fill="none" stroke="rgba(11,11,11,0.40)" stroke-width="0.8"/>
      <text x="462" y="81" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="520" y="104" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP 클라이언트</text>
      <text x="520" y="120" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OAuth client · PKCE</text>

      <rect x="752" y="64" width="176" height="64" rx="6" fill="rgba(11,11,11,0.03)" stroke="rgba(11,11,11,0.30)" stroke-width="1"/>
      <rect x="760" y="72" width="28" height="12" rx="2" fill="none" stroke="rgba(11,11,11,0.30)" stroke-width="0.8"/>
      <text x="774" y="81" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AS</text>
      <text x="840" y="104" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">인가 서버</text>
      <text x="840" y="120" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OAuth 2.1 AS</text>

      <!-- ── 라이프라인 ───────────────────────────────────────── -->
      <line x1="200" y1="128" x2="200" y2="640" stroke="rgba(11,11,11,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="520" y1="128" x2="520" y2="640" stroke="rgba(11,11,11,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="128" x2="840" y2="640" stroke="rgba(11,11,11,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ── 활성 구간 (응답하는 쪽) ──────────────────────────── -->
      <rect x="196" y="176" width="8" height="40" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <rect x="196" y="248" width="8" height="40" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <rect x="836" y="320" width="8" height="40" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <rect x="836" y="428" width="8" height="40" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <rect x="836" y="500" width="8" height="40" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <rect x="196" y="572" width="8" height="40" fill="rgba(235,104,52,0.10)" stroke="#eb6834" stroke-width="0.8"/>

      <!-- ── 메시지 (36px 간격) ───────────────────────────────── -->

      <!-- r1 y=176 -->
      <line x1="520" y1="176" x2="204" y2="176" stroke="#52514e" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="288" y="156" width="144" height="12" rx="2" fill="#f9f9f7"/>
      <text x="360" y="165" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /MCP · 토큰 없이</text>

      <!-- r2 y=212 -->
      <line x1="204" y1="212" x2="520" y2="212" stroke="#52514e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="264" y="192" width="192" height="12" rx="2" fill="#f9f9f7"/>
      <text x="360" y="201" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">401 WWW-AUTHENTICATE · SCOPE</text>

      <!-- r3 y=248 -->
      <line x1="520" y1="248" x2="204" y2="248" stroke="#52514e" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="288" y="228" width="144" height="12" rx="2" fill="#f9f9f7"/>
      <text x="360" y="237" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GET PRM · RFC 9728</text>

      <!-- r4 y=284 -->
      <line x1="204" y1="284" x2="520" y2="284" stroke="#52514e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="284" y="264" width="152" height="12" rx="2" fill="#f9f9f7"/>
      <text x="360" y="273" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AUTHORIZATION_SERVERS[]</text>

      <!-- r5 y=320 -->
      <line x1="520" y1="320" x2="836" y2="320" stroke="#2a78d6" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="588" y="300" width="184" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="309" fill="#2a78d6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GET AS METADATA · RFC 8414</text>

      <!-- r6 y=356 -->
      <line x1="836" y1="356" x2="520" y2="356" stroke="#2a78d6" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="560" y="336" width="240" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="345" fill="#2a78d6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ENDPOINTS + CODE_CHALLENGE_METHODS</text>

      <!-- r7 y=392 — 와이어 홉 없는 단계 -->
      <line x1="204" y1="392" x2="836" y2="392" stroke="rgba(11,11,11,0.20)" stroke-width="0.8" stroke-dasharray="2,4"/>
      <rect x="368" y="384" width="304" height="16" rx="2" fill="#f9f9f7"/>
      <text x="520" y="395" fill="#898781" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">등록 · 홉 없음 — CIMD &gt; 사전등록 &gt; DCR</text>

      <!-- r8 y=428 -->
      <line x1="520" y1="428" x2="836" y2="428" stroke="#2a78d6" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="564" y="408" width="232" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="417" fill="#2a78d6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">/AUTHORIZE · PKCE S256 + RESOURCE 8707</text>

      <!-- r9 y=464 -->
      <line x1="836" y1="464" x2="520" y2="464" stroke="#2a78d6" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="608" y="444" width="144" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="453" fill="#2a78d6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CODE + ISS · RFC 9207</text>

      <!-- r10 y=500 -->
      <line x1="520" y1="500" x2="836" y2="500" stroke="#2a78d6" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="596" y="480" width="168" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="489" fill="#2a78d6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">/TOKEN · CODE + VERIFIER</text>

      <!-- r11 y=536 -->
      <line x1="836" y1="536" x2="520" y2="536" stroke="#2a78d6" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="588" y="516" width="184" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="525" fill="#2a78d6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ACCESS_TOKEN · AUD = MCP 서버</text>

      <!-- r12 y=572 — 초점 -->
      <line x1="520" y1="572" x2="204" y2="572" stroke="#eb6834" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="268" y="552" width="184" height="12" rx="2" fill="#f9f9f7"/>
      <text x="360" y="561" fill="#eb6834" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AUTHORIZATION: BEARER · 매 요청</text>

      <!-- r13 y=608 -->
      <line x1="204" y1="608" x2="520" y2="608" stroke="#52514e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="284" y="588" width="152" height="12" rx="2" fill="#f9f9f7"/>
      <text x="360" y="597" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">200 · AUD 검증 통과</text>

      <!-- ── 단계 색인 눈금 ───────────────────────────────────── -->
      <line x1="64" y1="168" x2="64" y2="220" stroke="rgba(11,11,11,0.20)" stroke-width="1"/>
      <text x="40" y="197" fill="#52514e" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <line x1="64" y1="240" x2="64" y2="292" stroke="rgba(11,11,11,0.20)" stroke-width="1"/>
      <text x="40" y="269" fill="#52514e" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <line x1="64" y1="312" x2="64" y2="364" stroke="rgba(11,11,11,0.20)" stroke-width="1"/>
      <text x="40" y="341" fill="#52514e" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <line x1="64" y1="384" x2="64" y2="400" stroke="rgba(11,11,11,0.20)" stroke-width="1"/>
      <text x="40" y="396" fill="#898781" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <line x1="64" y1="420" x2="64" y2="436" stroke="rgba(11,11,11,0.20)" stroke-width="1"/>
      <text x="40" y="432" fill="#52514e" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <line x1="64" y1="456" x2="64" y2="544" stroke="rgba(11,11,11,0.20)" stroke-width="1"/>
      <text x="40" y="504" fill="#52514e" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      <line x1="64" y1="564" x2="64" y2="616" stroke="#eb6834" stroke-width="1"/>
      <text x="40" y="593" fill="#eb6834" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>

      <!-- ── 범례 ─────────────────────────────────────────────── -->
      <line x1="20" y1="664" x2="940" y2="664" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>
      <text x="20" y="684" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="96" y1="681" x2="128" y2="681" stroke="#52514e" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="136" y="684" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">요청</text>
      <line x1="196" y1="681" x2="228" y2="681" stroke="#52514e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="236" y="684" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">응답</text>
      <line x1="296" y1="681" x2="328" y2="681" stroke="#2a78d6" stroke-width="1" marker-end="url(#arrow-link)"/>
      <text x="336" y="684" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">OAuth 2.1 구간</text>
      <line x1="464" y1="681" x2="496" y2="681" stroke="#eb6834" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="504" y="684" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">체인의 목적</text>
      <rect x="620" y="674" width="8" height="14" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <text x="636" y="684" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">처리 중</text>
      <line x1="712" y1="681" x2="744" y2="681" stroke="rgba(11,11,11,0.20)" stroke-width="0.8" stroke-dasharray="2,4"/>
      <text x="752" y="684" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">와이어 홉 아님</text>
    </svg>
  </div>
</body>
</html>
