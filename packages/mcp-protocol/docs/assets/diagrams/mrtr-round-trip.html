<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRTR 왕복</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f9f9f7;
      --color-ink:     #0b0b0b;
      --color-muted:   #52514e;
      --color-accent:  #eb6834;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · MRTR</p>
    <h1>서버는 요청을 못 보낸다 — 그래서 클라이언트가 새 id로 다시 온다</h1>

    <svg viewBox="0 0 960 660" role="img" aria-labelledby="mrtr-round-trip-title mrtr-round-trip-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="mrtr-round-trip-title">MRTR 다회 왕복 요청의 메시지 순서</title>
      <desc id="mrtr-round-trip-desc">사용자·모델 · MCP 클라이언트 · MCP 서버 사이의 시간순 메시지 교환. 클라이언트가 tools/call을 보내면 서버는 input_required 결과에 필요 입력 목록과 불투명한 requestState를 담아 되돌려주고, 클라이언트가 사용자에게서 입력을 받아 원래 요청을 새 JSON-RPC id로 재시도한다. 이 왕복은 정보가 찰 때까지 반복될 수 있는 구간으로 묶여 있고, 서버는 재시도마다 requestState의 무결성을 자기 검증한 뒤 complete 결과를 돌려준다.</desc>

      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(11,11,11,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#52514e"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6834"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f9f7"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ── 반복 구간 프레임 ─────────────────────────────────── -->
      <rect x="176" y="200" width="688" height="288" rx="4" fill="rgba(11,11,11,0.02)" stroke="rgba(11,11,11,0.22)" stroke-width="1"/>
      <rect x="176" y="200" width="48" height="16" rx="2" fill="#f9f9f7" stroke="rgba(11,11,11,0.22)" stroke-width="1"/>
      <text x="200" y="212" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="188" y="236" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[정보가 찰 때까지 · 서버는 재시도를 가정하지 않는다]</text>

      <!-- ── 참여자 ───────────────────────────────────────────── -->
      <rect x="112" y="64" width="176" height="64" rx="6" fill="rgba(82,81,78,0.10)" stroke="#898781" stroke-width="1"/>
      <rect x="120" y="72" width="32" height="12" rx="2" fill="none" stroke="rgba(11,11,11,0.30)" stroke-width="0.8"/>
      <text x="136" y="81" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="200" y="104" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">사용자 · 모델</text>
      <text x="200" y="120" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">입력의 출처</text>

      <rect x="432" y="64" width="176" height="64" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1"/>
      <rect x="440" y="72" width="44" height="12" rx="2" fill="none" stroke="rgba(11,11,11,0.40)" stroke-width="0.8"/>
      <text x="462" y="81" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="520" y="104" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP 클라이언트</text>
      <text x="520" y="120" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">입력 수집 · 재시도</text>

      <rect x="752" y="64" width="176" height="64" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1"/>
      <rect x="760" y="72" width="44" height="12" rx="2" fill="none" stroke="rgba(11,11,11,0.40)" stroke-width="0.8"/>
      <text x="782" y="81" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
      <text x="840" y="104" fill="#0b0b0b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP 서버</text>
      <text x="840" y="120" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">무상태 · 요청 못 보냄</text>

      <!-- ── 라이프라인 ───────────────────────────────────────── -->
      <line x1="200" y1="128" x2="200" y2="552" stroke="rgba(11,11,11,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="520" y1="128" x2="520" y2="552" stroke="rgba(11,11,11,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="128" x2="840" y2="552" stroke="rgba(11,11,11,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ── 활성 구간 ────────────────────────────────────────── -->
      <rect x="836" y="176" width="8" height="80" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <rect x="196" y="296" width="8" height="48" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <rect x="836" y="376" width="8" height="148" fill="rgba(235,104,52,0.10)" stroke="#eb6834" stroke-width="0.8"/>

      <!-- ── 메시지 ───────────────────────────────────────────── -->

      <!-- r1 y=176 -->
      <line x1="520" y1="176" x2="836" y2="176" stroke="#52514e" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- r2 y=252 -->
      <line x1="836" y1="252" x2="520" y2="252" stroke="#52514e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- r3 y=296 -->
      <line x1="520" y1="296" x2="204" y2="296" stroke="#52514e" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- r4 y=340 -->
      <line x1="204" y1="340" x2="520" y2="340" stroke="#52514e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- r5 y=376 — 초점 -->
      <line x1="520" y1="376" x2="836" y2="376" stroke="#eb6834" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- r6 자기 메시지 -->
      <path d="M 836 424 H 776 a 8 8 0 0 0 -8 8 V 444 a 8 8 0 0 0 8 8 H 832"
            fill="none" stroke="#52514e" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- r7 y=520 -->
      <line x1="836" y1="520" x2="520" y2="520" stroke="#52514e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ── 메시지 라벨 ──────────────────────────────────────── -->

      <rect x="620" y="156" width="120" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="165" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">tools/call · id: 1</text>

      <rect x="588" y="232" width="184" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="241" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">resultType: input_required</text>
      <text x="680" y="268" fill="#898781" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">inputRequests{} + requestState (둘 중 최소 1개)</text>

      <rect x="284" y="276" width="152" height="12" rx="2" fill="#f9f9f7"/>
      <text x="360" y="285" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">elicitation · form 또는 url</text>

      <rect x="288" y="320" width="144" height="12" rx="2" fill="#f9f9f7"/>
      <text x="360" y="329" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">accept / decline / cancel</text>

      <rect x="608" y="356" width="144" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="365" fill="#eb6834" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">tools/call · 새 id 필수</text>
      <text x="680" y="392" fill="#898781" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">원래 params + inputResponses + requestState 그대로</text>

      <rect x="700" y="404" width="132" height="12" rx="2" fill="#f9f9f7"/>
      <text x="766" y="413" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">requestState 무결성 검증</text>
      <text x="760" y="472" fill="#898781" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">[HMAC/AEAD · 주체 · TTL · 요청 바인딩]</text>

      <rect x="608" y="500" width="144" height="12" rx="2" fill="#f9f9f7"/>
      <text x="680" y="509" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">resultType: complete</text>

      <!-- ── 범례 ─────────────────────────────────────────────── -->
      <line x1="20" y1="580" x2="940" y2="580" stroke="rgba(11,11,11,0.10)" stroke-width="0.8"/>
      <text x="20" y="600" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="96" y1="597" x2="128" y2="597" stroke="#52514e" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="136" y="600" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">요청</text>
      <line x1="196" y1="597" x2="228" y2="597" stroke="#52514e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="236" y="600" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">응답</text>
      <line x1="296" y1="597" x2="328" y2="597" stroke="#eb6834" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="336" y="600" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">재시도 (독립 요청)</text>
      <rect x="480" y="590" width="8" height="14" fill="rgba(11,11,11,0.06)" stroke="#52514e" stroke-width="0.8"/>
      <text x="496" y="600" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">처리 중</text>
      <rect x="572" y="590" width="40" height="14" rx="2" fill="#f9f9f7" stroke="rgba(11,11,11,0.22)" stroke-width="1"/>
      <text x="592" y="600" fill="#52514e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="620" y="600" fill="#52514e" font-size="8" font-family="'Geist Mono', monospace">반복 가능 구간</text>
    </svg>
  </div>
</body>
</html>
